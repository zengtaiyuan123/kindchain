name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Unit tests (governance / moderation / place)
        run: npm run test:unit

      - name: Production build + artifact validation
        run: npm run build

      - name: Rendered HTML + domain tests
        run: node --test tests/*.test.mjs

      - name: Resolve or create the D1 database
        id: d1
        run: |
          set -euo pipefail
          BASE="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          DB_ID=$(curl -s "${AUTH[@]}" "${BASE}?name=kindchain-network&per_page=100" \
            | jq -r '.result[]? | select(.name == "kindchain-network") | .uuid' | head -1)
          if [ -z "${DB_ID}" ]; then
            echo "Creating D1 database kindchain-network…"
            DB_ID=$(curl -s -X POST "${AUTH[@]}" "${BASE}" -d '{"name":"kindchain-network"}' \
              | jq -re '.result.uuid')
          fi
          echo "database id: ${DB_ID:0:8}…"
          echo "id=${DB_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate wrangler config
        run: node scripts/make-wrangler-config.mjs
        env:
          D1_DATABASE_ID: ${{ steps.d1.outputs.id }}

      - name: Deploy
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Set moderation admin token (optional)
        if: ${{ secrets.KINDCHAIN_ADMIN_TOKEN != '' }}
        run: printf '%s' "${{ secrets.KINDCHAIN_ADMIN_TOKEN }}" | npx wrangler secret put KINDCHAIN_ADMIN_TOKEN --config wrangler.generated.jsonc

      - name: Smoke-check the live deployment
        run: |
          set -euo pipefail
          SUB=$(curl -s -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" | jq -re '.result.subdomain')
          URL="https://kindchain-living-earth.${SUB}.workers.dev"
          echo "Live URL: ${URL}"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/api/network" || true)
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          echo "GET /api/network -> ${CODE}"
          test "$CODE" = "200"
          echo "URL=${URL}" >> "$GITHUB_STEP_SUMMARY"
